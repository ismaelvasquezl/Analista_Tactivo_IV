<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lectura de Nosotros · Coquimbo Unido</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="nosotros.js"></script>
<script src="liga_wyscout.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{--bg0:#0a0d11;--bg1:#0e1319;--panel:#151b22;--panel2:#1b222b;--panel3:#212a34;--gold:#ffd21f;--gold2:#e8bd00;--gold-ink:#0a0d11;
    --white:#f4f7fa;--txt:#dfe6ec;--mut:#aab8c4;--mut2:#7f8c98;--blue:#4a90ff;--teal:#3fd0c4;--green:#38d98a;--amber:#f5a623;--red:#ff5f5f;
    --line:rgba(255,255,255,.075);--line-strong:rgba(255,255,255,.14);--line-gold:rgba(255,210,0,.22);
    --sh:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.38);--r:14px;
    --f-display:'Barlow Condensed','Segoe UI',system-ui,sans-serif;--f-body:'Inter','Segoe UI',system-ui,Arial,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f-body);color:var(--txt);line-height:1.5;background:radial-gradient(1200px 700px at 18% -8%,#14202c 0,#0d131a 52%,#090c10 100%) fixed}
  h1,h2,h3,.brand,.disp{font-family:var(--f-display);letter-spacing:.3px}
  a{color:var(--teal);text-decoration:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
  .num{font-variant-numeric:tabular-nums}
  .stickytop{position:sticky;top:0;z-index:40}
  header{background:rgba(8,11,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-gold)}
  .hin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:var(--white)}
  .crest{width:26px;height:26px;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 25%,#000 0 50%);border:2px solid var(--gold);flex:none}
  .back{margin-left:auto;font-size:13px;color:var(--mut)}
  .tabs{background:rgba(8,11,15,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto}
  .tabsin{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:6px 10px}
  .tab{flex:0 0 auto;background:none;border:0;color:var(--mut);font-family:var(--f-display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
  .tab:hover{color:var(--white);background:rgba(255,255,255,.04)} .tab.active{color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold2))}
  main{max-width:1080px;margin:0 auto;padding:16px 14px 110px}
  .view{display:none}.view.active{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  h2{font-size:22px;margin:6px 0 2px;display:flex;align-items:center;gap:9px}h2::before{content:"";width:6px;height:20px;background:var(--gold);border-radius:3px}
  h3{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.7px;margin:16px 0 6px}
  .sub{color:var(--mut);font-size:13.5px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-top:12px}
  .grid{display:grid;gap:12px}@media(min-width:680px){.g2{grid-template-columns:1fr 1fr}}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
  .kpi{background:var(--bg1);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .kpi .v{font-family:var(--f-display);font-size:23px;font-weight:800;color:var(--gold)}.kpi .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  .chart-wrap{position:relative;height:260px}
  .callout{border-left:4px solid var(--gold);background:rgba(255,210,0,.06);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13.5px}
  .callout.warn{border-color:var(--amber);background:rgba(245,166,35,.07)}.callout.info{border-color:var(--blue);background:rgba(74,144,255,.07)}
  .pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
  .pc{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--sh)}
  .pc .hd{display:flex;align-items:center;gap:10px}
  .pc .dor{width:34px;height:34px;border-radius:9px;background:var(--panel3);border:1px solid var(--line-gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;color:var(--gold);flex:none}
  .pc .nm{font-family:var(--f-display);font-size:17px;font-weight:800;color:var(--white);line-height:1}
  .pc .meta{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  .pc .mg{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
  .pc .m{background:var(--bg1);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11px}
  .pc .m b{font-family:var(--f-display);font-size:15px;color:var(--white);display:block}
  .pc .nota{font-size:12.5px;color:var(--txt);border-top:1px solid var(--line);padding-top:8px}
  .chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
  .chip.gk{background:rgba(255,210,0,.16);color:var(--gold)} .chip.def{background:rgba(74,144,255,.16);color:var(--blue)}
  .chip.lat{background:rgba(63,208,196,.16);color:var(--teal)} .chip.vol{background:rgba(56,217,138,.16);color:var(--green)} .chip.del{background:rgba(245,166,35,.16);color:var(--amber)}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,210,0,.16);color:var(--gold);border:1px solid var(--line-gold)}
  .foot{color:var(--mut);font-size:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel3);color:var(--white);border:1px solid var(--line-strong);border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--gold-ink);border:0;font-weight:700}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .layerbtns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .lbtn{background:var(--bg1);border:1px solid var(--line-strong);color:var(--mut);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .lbtn:hover{color:var(--white)}.lbtn.on{background:var(--gold);color:#000;border-color:var(--gold)}
  @media print{header,.tabs,.btnrow,.no-print{display:none!important}.view{display:block!important}body{background:#fff!important;color:#111!important}.card,.pc,.kpi{background:#fff!important;border:1px solid #ccc!important;box-shadow:none!important;break-inside:avoid}h2,h3,.kpi .v,.pc .nm,.pc .m b{color:#111!important}.sub,.pc .nota,td,li{color:#222!important}}
</style>
</head>
<body>
<div class="stickytop">
<header><div class="hin"><div class="brand"><span class="crest"></span>LECTURA DE NOSOTROS · COQUIMBO UNIDO</div><a class="back" href="index_conapi.html">← Dashboard</a></div></header>
<nav class="tabs"><div class="tabsin" id="tabs">
  <button class="tab active" data-v="resumen">Resumen</button>
  <button class="tab" data-v="GK">Arqueros</button>
  <button class="tab" data-v="DEF">Defensas</button>
  <button class="tab" data-v="LAT">Laterales</button>
  <button class="tab" data-v="VOL">Volantes</button>
  <button class="tab" data-v="DEL">Delanteros</button>
  <button class="tab" data-v="fases">Por fase</button>
  <button class="tab" data-v="mapas">Mapas</button>
</div></nav>
</div>
<main>
  <section class="view active" id="v-resumen"></section>
  <section class="view" id="v-GK"></section>
  <section class="view" id="v-DEF"></section>
  <section class="view" id="v-LAT"></section>
  <section class="view" id="v-VOL"></section>
  <section class="view" id="v-DEL"></section>
  <section class="view" id="v-fases"></section>
  <section class="view" id="v-mapas"></section>
</main>
<script>
(function(){
'use strict';
const N=NOSOTROS, $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const charts={}; const destroy=k=>{if(charts[k]){charts[k].destroy();delete charts[k];}};
const GRPLABEL={GK:'Arqueros',DEF:'Defensas (centrales)',LAT:'Laterales',VOL:'Volantes',DEL:'Delanteros'};
const CHIP={GK:'gk',DEF:'def',LAT:'lat',VOL:'vol',DEL:'del'};

function pcard(p){
  const m=[];
  m.push(['Min',p.min+"'"]); m.push(['PJ',p.pj]);
  if(p.grupo==='DEL'){ m.push(['Goles',p.g]); m.push(['xG',p.xg]); m.push(['Remates',p.tiros+'/'+p.tirosArco]); }
  else if(p.grupo==='VOL'){ if(p.g)m.push(['Goles',p.g]); m.push(['xG',p.xg]); m.push(['xA',p.xa]); if(p.pases)m.push(['Pases %',p.pasesPct+'%']); }
  else if(p.grupo==='LAT'){ m.push(['xA',p.xa]); if(p.pases)m.push(['Pases',p.pases]); m.push(['Pases %',p.pasesPct+'%']); }
  else if(p.grupo==='DEF'){ if(p.pases)m.push(['Pases',p.pases]); m.push(['Pases %',p.pasesPct+'%']); }
  else { m.push(['Altura',p.alt+'cm']); }
  return `<div class="pc"><div class="hd"><div class="dor num">${p.d}</div>
     <div><div class="nm">${esc(p.n)}</div><div class="meta"><span class="chip ${CHIP[p.grupo]}">${p.pos}</span> · ${p.edad} años${p.alt?' · '+p.alt+'cm':''}</div></div></div>
     <div class="mg">${m.map(x=>`<div class="m"><b class="num">${x[1]}</b>${x[0]}</div>`).join('')}</div>
     <div class="nota">${esc(p.nota)}</div></div>`;
}
function renderGroup(g){
  const ps=N.players.filter(p=>p.grupo===g).sort((a,b)=>b.min-a.min);
  $('#v-'+g).innerHTML=`<h2>${GRPLABEL[g]}</h2><p class="sub">${ps.length} jugadores · dato agregado de los últimos 5 partidos (Hudl Wyscout). Ordenado por minutos.</p><div class="pcards">${ps.map(pcard).join('')}</div>`;
}

function renderResumen(){
  const t=N.temporada;
  $('#v-resumen').innerHTML=
   `<div class="card"><h2>Autoanálisis · últimos 5 + temporada</h2>
      <div class="sub">${esc(N.fuente)} · ${esc(N.ult5.nota)}</div>
      <div class="callout warn"><span class="badge">HALLAZGO CLAVE</span> ${esc(t.headline)}</div>
      <div class="kpis">
        <div class="kpi"><div class="v num">${t.pos}º</div><div class="l">Posición</div></div>
        <div class="kpi"><div class="v num">${t.pts}</div><div class="l">Puntos</div></div>
        <div class="kpi"><div class="v num">${t.xpts}</div><div class="l">xPoints</div></div>
        <div class="kpi"><div class="v num" style="color:var(--green)">+${t.xptsD}</div><div class="l">Infrarrendimiento</div></div>
        <div class="kpi"><div class="v num">${t.xg}</div><div class="l">xG (4º liga)</div></div>
        <div class="kpi"><div class="v num">+${t.xgdif}</div><div class="l">Dif. xG (top-4)</div></div>
      </div>
      <div class="btnrow no-print"><button class="btn primary" onclick="window.print()">🖨 Imprimir / PDF</button></div></div>
    <div class="grid g2">
      <div class="card"><h3>Definición: goles vs xG por jugador</h3><div class="chart-wrap"><canvas id="chFin"></canvas></div>
        <div class="sub" style="margin-top:6px">Barra bajo la línea de xG = margen de mejora en la definición.</div></div>
      <div class="card"><h3>Creadores: xA generado (5 partidos)</h3><div class="chart-wrap"><canvas id="chCre"></canvas></div>
        <div class="sub" style="margin-top:6px">Zavala y los carrileros Cornejo/Salinas concentran la creación.</div></div>
    </div>`;
  if(!window.Chart)return;
  const gc='rgba(255,255,255,.07)',tk='#aab8c4';
  const fin=N.players.filter(p=>p.xg>=0.3).sort((a,b)=>b.xg-a.xg);
  destroy('fin');
  charts.fin=new Chart($('#chFin'),{type:'bar',data:{labels:fin.map(p=>p.n.split(' ').slice(-1)[0]),
    datasets:[{label:'Goles',data:fin.map(p=>p.g),backgroundColor:'#ffd21f'},{label:'xG',data:fin.map(p=>p.xg),backgroundColor:'rgba(63,208,196,.6)'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tk}}},scales:{x:{ticks:{color:tk,font:{size:10}},grid:{color:gc}},y:{beginAtZero:true,ticks:{color:tk},grid:{color:gc}}}}});
  const cre=N.players.filter(p=>p.xa>=0.3).sort((a,b)=>b.xa-a.xa);
  destroy('cre');
  charts.cre=new Chart($('#chCre'),{type:'bar',data:{labels:cre.map(p=>p.n.split(' ').slice(-1)[0]),datasets:[{label:'xA',data:cre.map(p=>p.xa),backgroundColor:'#4a90ff'}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{color:tk},grid:{color:gc}},y:{ticks:{color:tk,font:{size:11}},grid:{display:false}}}}});
}
/* ---- motor de cancha SVG (mapas por zona) ---- */
function pitchSVG(layer){
  if(!layer)return''; const z=N.zonas,W=300,H=460,mx=12,my=12,pw=W-2*mx,ph=H-2*my,cols=3,bands=6,cw=pw/cols,bh=ph/bands;let cells='';
  if(layer.grid){const red=(layer.color==='red'||layer.tipo==='red');const base=red?[255,95,95]:[255,210,31];
    for(let b=0;b<bands;b++)for(let c=0;c<cols;c++){const v=layer.grid[b][c],x=mx+c*cw,y=my+(bands-1-b)*bh,a=(v*0.82).toFixed(2);
      cells+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${bh.toFixed(1)}" fill="rgba(${base[0]},${base[1]},${base[2]},${a})"/>`;
      if(v>=0.5)cells+=`<text x="${(x+cw/2).toFixed(1)}" y="${(y+bh/2+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#06131f" font-weight="800">${Math.round(v*100)}</text>`;}}
  let net='';
  if(layer.tipo==='weakdef'&&z.defensores){z.defensores.forEach(n=>{
    if(n.aer==null){net+=`<circle cx="${n.x}" cy="${n.y}" r="10" fill="#9aa7b2" fill-opacity=".3" stroke="#9aa7b2" stroke-width="2"/><text x="${n.x}" y="${n.y-13}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${n.d}</text><text x="${n.x}" y="${n.y+3.5}" text-anchor="middle" font-size="8" fill="#fff">ref.aérea</text>`;return;}
    const col=n.aer<=35?'#ff5f5f':n.aer<=50?'#f5a623':'#38d98a';const r=n.aer<=35?15:n.aer<=50?12:10;
    net+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${col}" fill-opacity=".30" stroke="${col}" stroke-width="2.5"/><text x="${n.x}" y="${n.y-r-3}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${n.d}</text><text x="${n.x}" y="${n.y+3.5}" text-anchor="middle" font-size="9" fill="#fff" font-weight="800">${n.aer}%</text>`;});}
  const lines=`<rect x="${mx}" y="${my}" width="${pw}" height="${ph}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><line x1="${mx}" y1="${my+ph/2}" x2="${mx+pw}" y2="${my+ph/2}" stroke="rgba(255,255,255,.22)"/><circle cx="${W/2}" cy="${my+ph/2}" r="30" fill="none" stroke="rgba(255,255,255,.22)"/><rect x="${W/2-46}" y="${my}" width="92" height="52" fill="none" stroke="rgba(255,255,255,.28)"/><rect x="${W/2-46}" y="${my+ph-52}" width="92" height="52" fill="none" stroke="rgba(255,255,255,.28)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:290px;background:linear-gradient(180deg,#123a1a,#0c2c13);border-radius:10px;border:1px solid var(--line-strong)">${cells}${lines}${net}<text x="${W-16}" y="20" font-size="9" fill="rgba(255,255,255,.65)" text-anchor="end">▲ ataque</text></svg>`;
}
function renderFases(){
  const f=N.fases,z=N.zonas,lay=id=>z.capas.find(c=>c.id===id);
  $('#v-fases').innerHTML=`<h2>Lectura por fase · con mapas</h2>
    <div class="card"><h3 style="color:var(--green)">● Fase ofensiva</h3><div class="sub">${esc(f.ofensiva)}</div>
      <div class="grid g2" style="margin-top:8px"><div style="text-align:center">${pitchSVG(lay('calor'))}<div class="sub">Mapa de calor (actividad)</div></div><div style="text-align:center">${pitchSVG(lay('pasesClave'))}<div class="sub">Pases clave / creación</div></div></div></div>
    <div class="card"><h3 style="color:var(--red)">● Fase defensiva</h3><div class="sub">${esc(f.defensiva)}</div>
      <div class="grid g2" style="margin-top:8px"><div style="text-align:center">${pitchSVG(lay('transiciones'))}<div class="sub">Recuperaciones / transición</div></div><div style="text-align:center">${pitchSVG(lay('perdidas'))}<div class="sub">Pérdidas de balón</div></div></div></div>
    <div class="card"><h3 style="color:var(--gold)">● Balón parado</h3><div class="sub">${esc(f.balonParado)}</div>
      <div style="text-align:center;margin-top:8px">${pitchSVG(lay('aereos'))}<div class="sub">Duelos aéreos por jugador (rojo = flojo)</div></div></div>
    <div class="callout info">${esc(N.confianza)}</div>`;
}
let curLayer='calor';
function renderMapas(){
  const z=N.zonas; if(!z)return; const box=$('#v-mapas');
  box.innerHTML=`<h2>Mapas tácticos por zona</h2><p class="sub">${esc(z.nota)} Ataque hacia arriba ↑. Elige la capa.</p>
    <div class="layerbtns" id="layerBtns"></div>
    <div class="grid g2" style="align-items:start"><div id="pitchBox" style="text-align:center"></div><div><div class="callout" id="layerInterp"></div></div></div>`;
  const btns=$('#layerBtns'); btns.innerHTML=z.capas.map(c=>`<button class="lbtn${c.id===curLayer?' on':''}" data-l="${c.id}">${esc(c.label)}</button>`).join('');
  btns.querySelectorAll('.lbtn').forEach(b=>b.onclick=()=>{curLayer=b.dataset.l;renderMapas();});
  const layer=z.capas.find(c=>c.id===curLayer)||z.capas[0];
  $('#pitchBox').innerHTML=pitchSVG(layer);
  $('#layerInterp').innerHTML='<b>'+esc(layer.label)+'.</b> '+esc(layer.interp);
}
['GK','DEF','LAT','VOL','DEL'].forEach(renderGroup);
renderResumen(); renderFases(); renderMapas();
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+t.dataset.v));
  if(t.dataset.v==='resumen')renderResumen();
  if(t.dataset.v==='mapas')renderMapas();
  window.scrollTo({top:120,behavior:'smooth'});
});
})();
</script>
</body>
</html>
